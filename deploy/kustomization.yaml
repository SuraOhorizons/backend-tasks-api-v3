apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - external-secret.yaml

commonLabels:
  app.kubernetes.io/name: backend-tasks-api-v3
  app.kubernetes.io/part-of: default
  app.kubernetes.io/managed-by: argocd
  open-horizons/horizon: h1

images:
  - name: app-image
    newName: crsuradev.azurecr.io/backend-tasks-api-v3
    newTag: v0.1.1
