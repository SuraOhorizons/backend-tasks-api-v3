apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-tasks-api-v3
  namespace: default
  labels:
    app: backend-tasks-api-v3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-tasks-api-v3
  template:
    metadata:
      labels:
        app: backend-tasks-api-v3
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend-tasks-api-v3
          image: crsuradev.azurecr.io/backend-tasks-api-v3:v0.1.1
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: backend-tasks-api-v3-config
            - secretRef:
                name: backend-tasks-api-v3-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
